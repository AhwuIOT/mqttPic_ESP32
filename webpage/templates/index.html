<!DOCTYPE html>
<html>
<head>
    <title>MQTT Web Sender</title>
</head>
<body>
    <h2>📨 發送訊息 / 圖片到 ESP32</h2>
    <form method="POST" action="/send" enctype="multipart/form-data">
        <p>文字訊息：</p>
        <input name="msg" placeholder="Enter message">
        <br><br>
        <p>上傳圖片：</p>
        <input type="file" name="image">
        <br><br>
        <button type="submit">Send</button>
    </form>
</body>
</html>
